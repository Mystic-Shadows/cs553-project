components:
  schemas:
    DatabaseError:
      type: object
      properties:
        status:
          type: string
          example: error
        database:
          type: string
          example: disconnected
    ReturnTask:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Create Client"
        description:
          type: string
          example: "As a tester, I want an interactive form that lets me test the routes."
        status:
          type: string
          example: "done"
        assignee:
          type: integer
          example: 1
        project:
          type: integer
          example: 2
        createdAt:
          type: string
          example: "2026-07-14T03:53:33.567Z"
        updatedAt:
          type: string
          example: "2026-07-14T03:53:33.567Z"
    CreateTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: "Create Client"
        description:
          type: string
          example: "As a tester, I want an interactive form that lets me test the routes."
        status:
          type: string
          example: "done"
        assignee:
          type: integer
          example: 1
        project:
          type: integer
          example: 2
    PatchTask:
      type: object
      properties:
        title:
          type: string
          example: "Create Client"
        description:
          type: string
          example: "As a tester, I want an interactive form that lets me test the routes."
        status:
          type: string
          example: "done"
        assignee:
          type: integer
          example: 1
        project:
          type: integer
          example: 2
    ReturnProject:
      type: object
      properties:
        id:
          type: integer
          example: 1
        project:
          type: string
          example: "Some Name"
        owner:
          type: integer
          example: 1
        description:
          type: string
          example: "Some Text"
        createdAt:
          type: string
          example: "2026-07-14T03:53:33.567Z"
        updatedAt:
          type: string
          example: "2026-07-14T03:53:33.567Z"
    CreateProject:
      type: object
      required:
        - project
      properties:
        project:
          type: string
          example: "Some Name"
        description:
          type: string
          example: "Some Text"
    PatchProject:
      type: object
      properties:
        project:
          type: string
          example: "Some Name"
        owner:
          type: integer
          example: 1
        description:
          type: string
          example: "Some Text"
    ReturnUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "Some Name"
        email:
          type: string
          example: "Some Text"
        role:
          type: string
          example: "user"
        createdAt:
          type: string
          example: "2026-07-14T03:53:33.567Z"
        updatedAt:
          type: string
          example: "2026-07-14T03:53:33.567Z"
    CreateUser:
      type: object
      required:
        - username
