openapi: 3.0.3
info:
  title: CS-553 Project
  version: 1.0.0
  description: This API stores tasks.

servers:
  - url: http://localhost:3000

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "cs553-api"
  /db-health:
    get:
      summary: Health check
      responses:
        "200":
          description: Database is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  database:
                    type: string
                    example: "connected"
                  currentTime:
                    type: string
                    example: "2026-07-14T03:53:33.567Z"
        "401":
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
  /login:
    post:
      summary: logs user in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/login"
      responses:
        "200":
          description: user is logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: object
                    example: "ok"
        "400":
          description: Username or Password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "401":
          description: Username or Password does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
  /register:
    post:
      summary: makes a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/login"
      responses:
        "200":
          description: user is made
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: object
                    example: "admin"
        "400":
          description: Username or Password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
  /tasks:
    get:
      summary: Gets the list of all tasks
      responses:
        "200":
          description: List of all tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReturnTask"
        "401":
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
    post:
      summary: Makes a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Successfully created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnTask"
        "400":
          description: Title is missing or misformated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "401":
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "403":
          description: User cannot create a task under this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: User/project id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
  /tasks/{id}:
    get:
      summary: Gets the task with the supplied id
      parameters:
        - name: id
          in: path
          required: true
          description: The task ID from the URL path.
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: The requested task was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnTask"
        "400":
          description: ID is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "401":
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "403":
          description: User cannot read a task under this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: Task with supplied id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
    put:
      summary: replaces the task with the supplied id
      parameters:
        - name: id
          in: path
          required: true
          description: The task ID from the URL path.
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "200":
          description: The requested task was replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnTask"
        "201":
          description: A new task was made at the ID number supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnTask"
        "400":
          description: There is an issue with the ID or Title. The ID could be not a number. The title could be missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "401":
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "403":
          description: User cannot create or modify a task under one of the projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: User/project id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
    patch:
      summary: updates the task with the supplied id
      parameters:
        - name: id
          in: path
          required: true
          description: The task ID from the URL path.
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTask"
      responses:
        "200":
          description: The requested task was updated (Must have one field other than 'id' to receive. Will get a 400 if only 'id' is filled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnTask"
        "400":
          description: Request Issue (Missing Fields, Invalid Type, Invalid Data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "401":
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "403":
          description: User cannot modify a task under one of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: Task with supplied id does not exist OR user/project id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
    delete:
      summary: deletes the task with the supplied id
      parameters:
        - name: id
          in: path
          required: true
          description: The task ID from the URL path.
          schema:
            type: integer
            example: 1
      responses:
        "204":
          description: The requested task was deleted
        "401":
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
        "403":
          description: User cannot delete a task under one of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: Task with supplied id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: Database connection is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseError"
